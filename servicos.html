<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trufos ERP - Catálogo de Serviços</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/modais.css" />
    <link rel="icon" type="image/x-icon" href="img/Favicon.ico" />
    <script src="js/core/auth.js"></script>
  </head>
  <body>
    <!-- O menu lateral será inserido automaticamente aqui pelo JS -->

    <main class="main-content">
      <header class="header-erp">
        <div class="header-text-erp">
          <h1>Serviços e Mão de Obra</h1>
          <p>
            Tabela de serviços técnicos, calibrações e taxas de deslocamento
          </p>
        </div>
      </header>

      <div class="page-header-actions">
        <input
          type="text"
          id="filtroServico"
          placeholder="🔍 Buscar por código ou descrição..."
          class="form-input"
          style="width: 320px"
        />
        <button class="btn-principal" onclick="abrirModalNovoServico()">
          + Novo Serviço
        </button>
      </div>

      <div class="card-tabela">
        <table class="tabela-dados">
          <thead>
            <tr>
              <th style="width: 160px">Código / SKU</th>
              <th>Descrição do Serviço Técnico</th>
              <th style="width: 150px">Valor Padrão</th>
              <th style="width: 160px; text-align: center">Ações</th>
            </tr>
          </thead>
          <tbody id="listaServicosTabela"></tbody>
        </table>
      </div>
    </main>

    <!-- MODAL DE SERVIÇO -->
    <div id="modalServico" class="modal-overlay">
      <div class="modal-card">
        <h2
          id="tituloModalServico"
          style="
            margin-top: 0;
            color: var(--azul-logo-trufos);
            margin-bottom: 25px;
          "
        >
          Novo Serviço
        </h2>

        <form id="formServico" onsubmit="salvarServico(event)">
          <input type="hidden" id="servicoIdEdicao" />

          <div class="form-group">
            <label class="form-label">Código / SKU *</label>
            <input
              type="text"
              id="codigo"
              required
              maxlength="13"
              class="form-input"
              placeholder="S-00000000001"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Descrição do Serviço *</label>
            <input
              type="text"
              id="descricao_servico"
              required
              class="form-input"
              placeholder="Ex: Qualificação Térmica de Autoclave"
            />
          </div>

          <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 15px">
            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <label class="form-label" style="margin-bottom: 0;">Perfil de Hora Técnica *</label>
                <a href="configuracoes.html" title="Gerenciar valores de hora técnica nas configurações" style="font-size: 0.75rem; color: var(--azul-trufos); text-decoration: none;">⚙️ Gerenciar HT</a>
              </div>
              <select id="perfil_ht_id" required class="form-input" style="margin-top: 5px;" onchange="aoSelecionarPerfilHT()">
                <option value="">Carregando perfis...</option>
              </select>
              <!-- Campo oculto para guardar o valor hora da seleção -->
              <input type="hidden" id="valor_hora_tecnica" value="0" />
            </div>

            <div class="form-group">
              <label class="form-label">Tempo Estimado (h) *</label>
              <input
                type="number"
                step="0.1"
                id="tempo_estimado_horas"
                required
                class="form-input"
                value="1.0"
                oninput="calcularTotalServico()"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Valor Venda Final (R$) *</label>
            <input
              type="number"
              step="0.01"
              id="valor"
              required
              class="form-input"
              value="0.00"
              style="font-weight: bold; color: #059669"
            />
          </div>

          <div
            style="
              display: flex;
              justify-content: flex-end;
              gap: 10px;
              margin-top: 25px;
              border-top: 1px solid #e2e8f0;
              padding-top: 20px;
            "
          >
            <button
              type="button"
              onclick="fecharModalServico()"
              style="
                background: #e2e8f0;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
              "
            >
              Cancelar
            </button>
            <button
              type="submit"
              id="btnSalvarServico"
              style="
                background: var(--azul-trufos);
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
              "
            >
              Salvar Serviço
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/servicos/servicos-main.js"></script>
    <script src="js/core/sidebar.js"></script>
  </body>
</html>
