<div
  id="modal-adicionar-produto-os"
  class="modal-overlay"
  style="display: none"
>
  <div class="modal-content" style="max-width: 720px; width: 95%">
    <div class="modal-header">
      <h3>Adicionar Peça / Produto à OS</h3>
      <button
        type="button"
        class="btn-close-modal"
        data-close-modal="modal-adicionar-produto-os"
      >
        &times;
      </button>
    </div>
    <div class="modal-body">
      <input
        type="text"
        id="busca-modal-produto"
        class="form-control"
        placeholder="Buscar peça por SKU, nome ou código..."
        style="margin-bottom: 14px"
      />
      <div style="max-height: 360px; overflow-y: auto">
        <table style="width: 100%; border-collapse: collapse">
          <thead>
            <tr
              style="
                background: #f8fafc;
                border-bottom: 1px solid #e2e8f0;
                text-align: left;
              "
            >
              <th style="padding: 8px 10px">SKU</th>
              <th style="padding: 8px 10px">Produto / Peça</th>
              <th style="padding: 8px 10px">Estoque</th>
              <th style="padding: 8px 10px">Preço (R$)</th>
              <th style="padding: 8px 10px; width: 90px">Ação</th>
            </tr>
          </thead>
          <tbody id="lista-modal-produtos"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
