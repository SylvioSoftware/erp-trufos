<div id="modal-selecionar-cliente" class="modal-overlay" style="display: none">
  <div class="modal-content" style="max-width: 720px; width: 95%">
    <div class="modal-header">
      <h3>Selecionar Cliente</h3>
      <button
        type="button"
        class="btn-close-modal"
        data-close-modal="modal-selecionar-cliente"
      >
        &times;
      </button>
    </div>
    <div class="modal-body">
      <input
        type="text"
        id="busca-modal-cliente"
        class="form-control"
        placeholder="Buscar por razão social, nome fantasia ou CNPJ/CPF..."
        style="margin-bottom: 14px"
      />
      <div style="max-height: 360px; overflow-y: auto">
        <table style="width: 100%; border-collapse: collapse">
          <thead>
            <tr
              style="
                background: #f8fafc;
                border-bottom: 1px solid #e2e8f0;
                text-align: left;
              "
            >
              <th style="padding: 8px 10px">Cliente</th>
              <th style="padding: 8px 10px">CNPJ / CPF</th>
              <th style="padding: 8px 10px">Cidade / UF</th>
              <th style="padding: 8px 10px; width: 90px">Ação</th>
            </tr>
          </thead>
          <tbody id="lista-modal-clientes"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
