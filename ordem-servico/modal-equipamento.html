<div
  id="modal-selecionar-equipamento"
  class="modal-overlay"
  style="display: none"
>
  <div class="modal-card" style="max-width: 780px">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 12px;
      "
    >
      <h2 style="margin: 0; color: var(--azul-logo-trufos); font-size: 1.25rem">
        🩺 Selecionar Equipamento do Cliente
      </h2>
      <button
        type="button"
        data-close-modal="modal-selecionar-equipamento"
        aria-label="Fechar modal"
        style="
          background: transparent;
          border: none;
          font-size: 1.35rem;
          cursor: pointer;
          color: #64748b;
          line-height: 1;
        "
      >
        ✕
      </button>
    </div>

    <div style="margin-bottom: 14px">
      <input
        type="text"
        id="busca-modal-equipamento"
        class="form-control"
        placeholder="Buscar por tipo, marca, modelo, número de série ou patrimônio..."
      />
    </div>

    <div
      style="
        max-height: 380px;
        overflow-y: auto;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
      "
    >
      <table
        class="tabela-dados"
        style="width: 100%; border-collapse: collapse"
      >
        <thead>
          <tr
            style="
              background: #f8fafc;
              text-align: left;
              border-bottom: 1px solid #e2e8f0;
            "
          >
            <th style="padding: 10px">Equipamento (Tipo / Marca / Modelo)</th>
            <th style="padding: 10px">Nº de Série</th>
            <th style="padding: 10px">Patrimônio / TAG</th>
            <th style="padding: 10px; width: 110px">Ação</th>
          </tr>
        </thead>
        <tbody id="lista-modal-equipamentos">
          <tr>
            <td
              colspan="4"
              style="padding: 16px; text-align: center; color: #64748b"
            >
              Carregando equipamentos...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
