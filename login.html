<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trufos ERP - Acesso Restrito</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="icon" type="image/x-icon" href="img/Favicon.ico" />
  </head>
  <body class="login-page">
    <div class="login-card">
      <img src="img/logo.png" alt="Logo Trufos" />
      <h2>Acesso Restrito</h2>
      <p>
        Um código de verificação foi enviado automaticamente para o seu
        WhatsApp.
      </p>

      <input
        type="text"
        id="codigoInput"
        class="input-code"
        maxlength="6"
        placeholder="------"
      />
      <button onclick="validarCodigo()" class="btn-entrar">
        Entrar no Sistema
      </button>

      <div id="statusEnvio" class="status-envio"></div>
    </div>

    <script>
      const WEBHOOK_URL = "https://n8n.trufos.com.br/webhook/erp-gerar-codigo";
      const TOKEN_KEY = "trufos_erp_auth";

      window.addEventListener("DOMContentLoaded", () => {
        solicitarNovoCodigo();
      });

      async function solicitarNovoCodigo() {
        const statusEl = document.getElementById("statusEnvio");
        statusEl.style.color = "#008000";
        statusEl.innerText = "A solicitar código via WhatsApp...";

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ acao: "gerar_codigo" }),
          });

          if (response.ok) {
            statusEl.innerText = "📲 Código enviado com sucesso!";
          } else {
            statusEl.style.color = "red";
            statusEl.innerText = "Erro no servidor (" + response.status + ").";
          }
        } catch (error) {
          console.error("Erro no fetch:", error);
          statusEl.style.color = "red";
          statusEl.innerText = "Erro de conexão / CORS com o n8n.";
        }
      }

      function validarCodigo() {
        const digitado = document.getElementById("codigoInput").value.trim();

        if (digitado.length !== 6) {
          alert("Por favor, digite o código completo de 6 dígitos.");
          return;
        }

        const sessao = {
          authenticated: true,
          expiresAt: new Date().getTime() + 24 * 60 * 60 * 1000,
        };

        localStorage.setItem(TOKEN_KEY, JSON.stringify(sessao));
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
